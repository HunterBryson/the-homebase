<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Homebase</title>
<link rel="icon" href="/api/picture/ai" />
<style>
:root{
  --bg:#06070b; --panel:rgba(12,14,20,.78); --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --text:#dfe2ea; --muted:#9097a8; --faint:#5d6476; --ai:#f2a84b; --ai2:#ffcf8a; --flag:#e88fb4; --glow:#ffd6a0;
  --r:14px; --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif; --mono:"Cascadia Code",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab}
canvas.drag{cursor:grabbing} canvas.point{cursor:pointer}
.panel{position:fixed;background:var(--panel);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 20px 60px rgba(0,0,0,.45)}

/* top left: hello */
#hello{left:20px;top:18px;padding:10px 16px 10px 12px;display:flex;align-items:center;gap:12px;border-radius:999px;max-width:calc(100vw - 40px)}
#hello .dot{width:24px;height:24px;border-radius:50%;flex:none;background:radial-gradient(circle at 50% 55%,var(--ai) 0 30%,color-mix(in srgb,var(--ai) 20%,transparent) 31% 60%,transparent 61%)}
#hello b{font-weight:600} #hello .clock{color:var(--muted)}
#since{display:none;margin-left:4px;padding:5px 12px;border-radius:999px;background:rgba(255,214,160,.12);border:1px solid rgba(255,214,160,.35);color:var(--glow);font-weight:600;font-size:14px;white-space:nowrap}
#since.on{display:inline-block} #since:hover{background:rgba(255,214,160,.2)}

/* left: the nav, theirs */
#nav{left:20px;top:78px;bottom:20px;width:292px;display:flex;flex-direction:column;overflow:hidden}
#find{display:flex;align-items:center;gap:10px;margin:12px 12px 6px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
#find input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit}
#find .k{font:12px var(--mono);color:var(--faint);border:1px solid var(--line2);border-radius:5px;padding:0 5px}
#navlist{flex:1;overflow:auto;padding:4px 8px 14px}
.group{font-size:12.5px;color:var(--muted);letter-spacing:.3px;padding:14px 10px 6px}
.item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--text)}
.item:hover{background:rgba(255,255,255,.05)}
.item .ic{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.04);color:var(--ai)}
.item .ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.item .t{min-width:0} .item .t div:first-child{font-weight:500}
.item .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{font-size:13.5px;color:var(--faint);padding:4px 10px 6px;line-height:1.45}
.yours{margin:10px 8px 4px;padding:14px 14px 12px;border-radius:12px;border:1px dashed var(--line2);color:var(--muted);font-size:14px;line-height:1.5}
.yours b{color:var(--text);display:block;margin-bottom:4px;font-size:15px}
.yours .use{margin-top:10px;padding:7px 14px;border-radius:999px;background:color-mix(in srgb,var(--ai) 16%,transparent);border:1px solid color-mix(in srgb,var(--ai) 45%,transparent);color:var(--ai2);font-weight:600}
.suggested{opacity:.55;pointer-events:none}

/* right: what's waiting */
#side{right:20px;top:18px;bottom:20px;width:340px;display:flex;flex-direction:column;overflow:hidden;transition:opacity .25s}
#side .scroll{overflow:auto;padding:6px 14px 16px;flex:1}
.sec{padding:12px 4px 4px}
.sec h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center}
.sec h3 button{font-size:13px;color:var(--ai2);font-weight:500}
.row{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:10px;margin:2px 0}
.row:hover{background:rgba(255,255,255,.05)}
.row b{font-weight:500;display:block} .row small{display:block;color:var(--muted);font-size:13px}
.row.glow b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--glow);box-shadow:0 0 10px var(--glow);margin-right:8px;vertical-align:1px}
.row.flag b::before{content:"⚑";color:var(--flag);margin-right:7px}
.row.done small.what{color:#b9e3c6}
.day{font-size:12.5px;color:var(--faint);padding:10px 10px 2px}
.quiet{color:var(--faint);font-size:14px;padding:4px 10px 8px}
.save small.paths{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* the reader */
#reader{right:20px;top:18px;bottom:20px;width:min(640px,calc(100vw - 360px));display:flex;flex-direction:column;transform:translateX(calc(100% + 40px));transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:5}
#reader.on{transform:none}
#reader header{display:flex;align-items:center;gap:10px;padding:14px 14px 10px 20px;border-bottom:1px solid var(--line)}
#reader .p{flex:1;min-width:0;font:13px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.chip.word{color:var(--ai2);border-color:color-mix(in srgb,var(--ai) 40%,transparent)}
#rflag{padding:6px 12px;border-radius:999px;border:1px solid rgba(232,143,180,.4);color:var(--flag);font-weight:600;font-size:14px;white-space:nowrap}
#rflag:hover{background:rgba(232,143,180,.1)}
#rclose{width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:16px} #rclose:hover{background:rgba(255,255,255,.06);color:var(--text)}
#tabs{display:flex;gap:4px;padding:8px 18px 0}
#tabs button{padding:6px 12px;border-radius:8px;color:var(--muted);font-size:14px}
#tabs button.on{background:rgba(255,255,255,.06);color:var(--text)}
#tabs button.glowtab.on,#tabs button.glowtab{color:var(--glow)}
#rbody{flex:1;overflow:auto;padding:10px 26px 40px}
.flagbox{margin:12px 0 4px;padding:12px 14px;border-radius:12px;background:rgba(232,143,180,.06);border:1px solid rgba(232,143,180,.25)}
.flagbox .fh{display:flex;justify-content:space-between;gap:10px;color:var(--flag);font-size:13.5px;font-weight:600}
.flagbox .fh button{color:var(--muted);font-weight:500}
.flagbox blockquote{margin:8px 0;padding:4px 10px;border-left:2px solid rgba(232,143,180,.5);color:var(--muted);font-size:14px}
.flagbox textarea{width:100%;margin-top:8px;min-height:64px;resize:vertical;background:rgba(0,0,0,.25);border:1px solid var(--line2);border-radius:8px;color:var(--text);font:15px/1.45 var(--font);padding:9px 10px;outline:0}
.flagbox .st{font-size:12.5px;color:var(--faint);margin-top:4px}
.flagbox.done{background:rgba(126,224,161,.05);border-color:rgba(126,224,161,.22)}
.flagbox.done .fh{color:#9ed9b2}
.flagbox .ans{margin-top:8px;color:var(--text)}
.diff{margin-top:12px;font-size:15.5px;line-height:1.55}
.diff span{display:block;padding:5px 12px;border-left:3px solid transparent;border-radius:4px;margin:2px 0}
.diff .a{color:#e8f7ec;background:rgba(126,224,161,.09);border-left-color:#7ee0a1}
.diff .d{color:#d9a3a3;background:rgba(255,107,107,.06);border-left-color:rgba(255,107,107,.6);text-decoration:line-through;text-decoration-color:rgba(240,160,160,.45)}
.diff .c{color:var(--faint)}
.diff .h{color:var(--faint);padding:0 12px}
.commits{margin-top:18px;font-size:13.5px;color:var(--muted)} .commits div{padding:3px 0}

/* markdown */
.md{font-size:15.5px;line-height:1.62}
.md h1{font-size:24px;margin:16px 0 10px;font-weight:650;color:#fff}
.md h2{font-size:18px;margin:22px 0 8px;font-weight:600;color:#fff}
.md h3{font-size:16px;margin:18px 0 6px;font-weight:600}
.md p{margin:8px 0} .md ul,.md ol{margin:6px 0;padding-left:22px} .md li{margin:3px 0}
.md code{font:13.5px var(--mono);background:rgba(255,255,255,.06);padding:1px 5px;border-radius:5px}
.md pre{background:rgba(0,0,0,.3);padding:10px 12px;border-radius:8px;overflow:auto} .md pre code{background:none;padding:0}
.md blockquote{margin:8px 0;padding:2px 14px;border-left:2px solid var(--line2);color:var(--muted)}
.md table{border-collapse:collapse;margin:10px 0;font-size:14px;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--line2);padding:5px 9px;text-align:left;vertical-align:top}
.md th{color:var(--muted);font-weight:600}
.md a,.md .link{color:var(--ai2);cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--ai) 40%,transparent);text-underline-offset:3px}
.md hr{border:0;border-top:1px solid var(--line2);margin:16px 0}
.md strong{color:#fff}

/* tooltip, welcome, toast */
#tip{pointer-events:none;padding:10px 13px;max-width:340px;font-size:14px;opacity:0;transition:opacity .15s;z-index:6}
#tip.on{opacity:1} #tip b{display:block;font-weight:600} #tip small{color:var(--muted);display:block} #tip .w{color:var(--ai2);font-size:13px}
#welcome{display:none;gap:12px;align-items:flex-start;margin:14px 4px 4px;padding:14px;border-radius:12px;background:color-mix(in srgb,var(--ai) 8%,transparent);border:1px solid color-mix(in srgb,var(--ai) 28%,transparent)}
#welcome.on{display:flex} #welcome img{width:46px;height:46px;border-radius:50%;flex:none;object-fit:cover}
#welcome b{display:block;margin-bottom:3px} #welcome p{margin:0 0 6px;color:var(--muted);font-size:14px;line-height:1.45}
#welcome .got{margin-top:4px;padding:5px 14px;border-radius:999px;border:1px solid var(--line2);font-weight:600;font-size:14px}
#toast{left:50%;top:20px;transform:translate(-50%,-80px);padding:9px 16px;border-radius:999px;transition:transform .25s;z-index:7;font-size:14px}
#toast.on{transform:translate(-50%,0)}
#mob{display:none}

@media (max-width: 980px){
  #nav,#side{display:none} #nav.open,#side.open{display:flex;z-index:4} #nav{width:calc(100vw - 40px)} #side{width:calc(100vw - 40px);top:78px}
  #reader{width:calc(100vw - 24px);right:12px;top:12px;bottom:12px}
  #mob{display:flex;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);gap:8px;z-index:3}
  #mob button{padding:9px 16px;border-radius:999px}
  #welcome{bottom:74px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hello" class="panel"><div class="dot"></div><div><b id="greet">Hello</b> <span class="clock" id="clock"></span></div><button id="since" title="Light up everything your AI changed since you last looked"></button></div>

<aside id="nav" class="panel">
  <label id="find"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8a90a0" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Find anything in the brain" autocomplete="off"/><span class="k">/</span></label>
  <div id="navlist"></div>
</aside>

<aside id="side" class="panel"><div class="scroll"><div id="welcome"><img id="wimg" alt="" /><div><b id="wtitle"></b><div id="wtext"></div><button class="got" id="wgot">Got it</button></div></div><div id="sidebody"></div></div></aside>

<aside id="reader" class="panel">
  <header><div class="p" id="rpath"></div><span id="rword"></span><button id="rflag" title="Flag this block for your AI to fix. Select the wrong part first to flag just that.">⚑ Flag</button><button id="rclose" title="Close (Esc)">✕</button></header>
  <div id="tabs"></div>
  <div id="rbody" class="md"></div>
</aside>

<div id="tip" class="panel"></div>
<div id="toast" class="panel"></div>
<div id="mob"><button class="panel" data-t="nav">Yours</button><button class="panel" data-t="side">Changes</button></div>

<script>
(() => {
// ---------- small helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const j = async (u, o) => { const r = await fetch(u, { cache: 'no-store', ...o }); return r.json(); };
const post = (u, b) => j(u, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b || {}) });
const hash = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return ((h >>> 0) % 1000) / 1000; };
const hrs = iso => (Date.now() - Date.parse(iso)) / 36e5;
const ago = iso => { const h = hrs(iso); if (!isFinite(h)) return ''; if (h < 1 / 60) return 'just now'; if (h < 1) return Math.round(h * 60) + 'm ago'; if (h < 24) return Math.round(h) + 'h ago'; return Math.round(h / 24) + 'd ago'; };
const dayOf = iso => { const d = new Date(iso), t = new Date(); const k = x => x.toDateString(); if (k(d) === k(t)) return 'Today'; t.setDate(t.getDate() - 1); if (k(d) === k(t)) return 'Yesterday'; return d.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' }); };
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }
const rgb = hex => { const n = parseInt(hex.replace('#', ''), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const rgba = (hex, a) => { const [r, g, b] = rgb(hex); return `rgba(${r},${g},${b},${a})`; };

const ICONS = {
  mark: '<path d="M7 3.5h10v17l-5-3.8-5 3.8z"/><path d="M10 8h4"/>',
  words: '<path d="M4 6h9M4 11h14M4 16h7"/><circle cx="18" cy="6" r="1.6"/><path d="M15 15.5l2 2 4-4"/>',
  person: '<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/>',
  chat: '<path d="M3.5 6.5a2.5 2.5 0 0 1 2.5-2.5h7.5a2.5 2.5 0 0 1 2.5 2.5v4a2.5 2.5 0 0 1-2.5 2.5H9l-3.5 3v-3a2.5 2.5 0 0 1-2-2.5z"/><path d="M18.5 8.2a2.3 2.3 0 0 1 2 2.3v3.7a2.3 2.3 0 0 1-2 2.3v2.5l-3.2-2.5h-3a2.3 2.3 0 0 1-2-1.2"/>',
  book: '<path d="M5.5 18.5V5.5a2 2 0 0 1 2-2h11v14h-11a2 2 0 0 0 0 4h11"/><path d="M9.5 7.5h5.5"/>',
  room: '<path d="M6.5 20.5V10a5.5 5.5 0 0 1 11 0v10.5"/><path d="M3.5 20.5h17"/><path d="M14.5 14.8v.01"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  page: '<rect x="4.5" y="3.5" width="15" height="17" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  money: '<path d="M3.5 18.5c3.5 0 5-2.5 7-5.5s3.5-5 7-5"/><circle cx="18" cy="6.5" r="2.2"/><path d="M3.5 20.5h17"/>',
  music: '<path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6 8.5 7 8.5-7"/>',
  tool: '<path d="M14.5 6.5a4 4 0 0 0 5 5l-8.5 8.5a2.1 2.1 0 0 1-3-3z"/><path d="M14.5 6.5 17 4l3 3-2.5 2.5"/>',
  star: '<path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
};
const icon = k => `<svg viewBox="0 0 24 24">${ICONS[k] || ICONS.link}</svg>`;

// ---------- state ----------
let W = 0, H = 0, DPR = 1;
const cv = $('c'), ctx = cv.getContext('2d');
let S = null;                    // the last /api/web
let nodes = [], links = [], byPath = {}, center = null, edges = [];
let changed = new Set(), flagged = new Set(), lastM = {};
let hover = null, focus = null, pulses = [], lit = new Set(), litUntil = 0;
const cam = { x: 0, y: 0, z: 1 }, camT = { x: 0, y: 0, z: 1 };
let AI = '#f2a84b', AI2 = '#ffcf8a';
const pics = {};
const stars = Array.from({ length: 220 }, () => ({ x: (Math.random() - .5) * 2600, y: (Math.random() - .5) * 2000, d: .2 + Math.random() * .8, s: Math.random() }));

function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; }
addEventListener('resize', () => { resize(); if (!focus) goHome(); });
resize();

const loadImg = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });

// ---------- the world ----------
function makeWorld(d) {
  const N = [], L = [], P = {};
  const c = { id: '@center', kind: 'center', path: d.center?.path || null, title: d.ai.name, about: d.center?.about, x: 0, y: 0, r: 46, mtime: d.center?.mtime };
  N.push(c); if (c.path) P[c.path] = c;
  // boot files sit close to the center
  d.boot.forEach((b, i) => {
    const a = -Math.PI / 3 + i * (Math.PI * 2 / Math.max(6, d.boot.length));
    const n = { id: b.path, kind: 'boot', path: b.path, title: b.title, about: b.about, x: Math.cos(a) * 100, y: Math.sin(a) * 100, r: 7, mtime: b.mtime, parent: c };
    N.push(n); P[b.path] = n; L.push({ a: c, b: n, k: 'block' });
  });
  const rooms = d.rooms, n = rooms.length;
  const R = n <= 4 ? 300 : n <= 8 ? 330 : 330 + (n - 8) * 22;
  rooms.forEach((rm, i) => {
    const a = -Math.PI / 2 + i * (2 * Math.PI / Math.max(1, n));
    const room = { id: 'room:' + rm.id, kind: 'room', path: rm.path, room: rm, title: rm.title, x: Math.cos(a) * R, y: Math.sin(a) * R, r: 15, ang: a, mtime: rm.mtime, count: rm.blocks.length };
    N.push(room); if (rm.path) P[rm.path] = room; L.push({ a: c, b: room, k: 'room' });
    const bl = rm.blocks, m = bl.length;
    const perRing = 9;
    bl.forEach((b, j) => {
      const ring = Math.floor(j / perRing), inRing = Math.min(perRing, m - ring * perRing), k = j % perRing;
      const spread = Math.min(1.5, .2 + inRing * .16);
      const ba = a + (inRing === 1 ? 0 : (k / (inRing - 1) - .5) * spread) + ring * .09;
      const br = 86 + ring * 50 + hash(b.path) * 22;
      const bn = { id: b.path, kind: 'block', path: b.path, title: b.title, about: b.about, x: room.x + Math.cos(ba) * br, y: room.y + Math.sin(ba) * br, r: 6, mtime: b.mtime, parent: room };
      N.push(bn); P[b.path] = bn; L.push({ a: room, b: bn, k: 'block' });
      b.support.forEach((s, q) => {
        const sa = ba + (q - (b.support.length - 1) / 2) * .5, sr = 18 + q * 2;
        const sn = { id: s.path, kind: 'support', path: s.path, title: s.title, about: s.about, x: bn.x + Math.cos(sa) * sr, y: bn.y + Math.sin(sa) * sr, r: 2.6, mtime: s.mtime, parent: bn };
        N.push(sn); P[s.path] = sn; L.push({ a: bn, b: sn, k: 'support' });
      });
    });
  });
  for (const t of d.threads) { const a = P[t.from], b = P[t.to]; if (a && b && a !== b && a.kind !== 'center' && b.kind !== 'center') L.push({ a, b, k: 'thread' }); }
  const FR = R + 250;
  const E = d.edges.map((e, i) => { const a = Math.PI * (.25 + i * 2 / Math.max(3, d.edges.length)); return { id: 'edge:' + i, kind: 'edge', title: e.name, color: e.color || '#8fb4ff', pic: e.picture ? '/api/picture/' + e.i : null, x: Math.cos(a) * FR, y: Math.sin(a) * FR, r: 26 }; });
  for (const e of E) { N.push(e); L.push({ a: c, b: e, k: 'edge' }); }

  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') { e.preventDefault(); $('q').focus(); }
});

// ⚑ flags: select a passage first to flag just that part
document.addEventListener('selectionchange', () => {
  const s = getSelection(); if (!s || !readerPath) return;
  const inBody = s.anchorNode && $('rbody').contains(s.anchorNode) && !(s.anchorNode.parentElement?.closest('.flagbox'));
  selQuote = inBody ? s.toString().trim().slice(0, 2000) : '';
  flagLabel();
});
function flagLabel() { $('rflag').textContent = selQuote ? '⚑ Flag this part' : '⚑ Flag'; }
$('rflag').onmousedown = e => e.preventDefault(); // keep the selection
$('rflag').onclick = async () => {
  if (!readerPath) return;
  const f = await post('/api/flag', { path: readerPath, quote: selQuote });
  if (f.error) return toast(f.error);
  getSelection().removeAllRanges(); selQuote = '';
  await refresh(); renderBlock();
  const t = $('rbody').querySelector(`[data-note="${f.id}"]`); if (t) { t.focus(); t.scrollIntoView({ block: 'center' }); }
  toast('Flagged. Add a word about what\'s off, if you like.');
};
const noteTimers = {};
function saveNote(id, text) {
  clearTimeout(noteTimers[id]);
  const st = document.querySelector(`[data-st="${id}"]`); if (st) st.textContent = 'Saving…';
  noteTimers[id] = setTimeout(async () => { await post('/api/flag/note', { id, note: text }); const f = (S?.flags || []).find(x => x.id === id); if (f) f.note = text; const st2 = document.querySelector(`[data-st="${id}"]`); if (st2) st2.textContent = 'Saved. Your AI fixes it when it next looks at its flags.'; renderSide(); }, 600);
}

// ---------- markdown, small and forgiving ----------
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, (m, c) => /\.md$/i.test(c) && resolve(c) ? `<code class="link" data-ref="${esc(resolve(c))}">${c}</code>` : `<code>${c}</code>`)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => { const r = resolve(u.replace(/&amp;/g, '&')); return r ? `<span class="link" data-ref="${esc(r)}">${t}</span>` : /^https?:/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t; })
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>');
}
function resolve(ref) {
  if (!S) return null;
  let p = ref.trim().replace(/^\.\//, '').replace(/[#?].*$/, '').replace(/^memory\//, '');
  if (byPath[p]) return p;
  if (readerPath) { const dir = readerPath.split('/').slice(0, -1); const parts = [...dir, ...p.split('/')]; const out = []; for (const x of parts) { if (x === '..') out.pop(); else if (x && x !== '.') out.push(x); } const q = out.join('/'); if (byPath[q]) return q; }
  return null;
}
function md(src) {
  const lines = String(src).replace(/\r/g, '').split('\n'); let out = '', i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { let code = ''; i++; while (i < lines.length && !/^```/.test(lines[i])) code += lines[i++] + '\n'; i++; out += `<pre><code>${esc(code)}</code></pre>`; continue; }
    const h = l.match(/^(#{1,6})\s+(.*)$/); if (h) { const lv = Math.min(3, h[1].length); out += `<h${lv}>${inline(h[2])}</h${lv}>`; i++; continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(l)) { out += '<hr>'; i++; continue; }
    if (/^\s*\|/.test(l)) { const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]); const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()); const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r)); out += '<table>' + body.map((r, k) => `<tr>${cells(r).map(c => k === 0 && rows.length > 1 && /^\s*\|[\s:|-]+\|\s*$/.test(rows[1]) ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join('')}</tr>`).join('') + '</table>'; continue; }
    if (/^\s*>/.test(l)) { let q = ''; while (i < lines.length && /^\s*>/.test(lines[i])) q += lines[i++].replace(/^\s*>\s?/, '') + ' '; out += `<blockquote>${inline(q)}</blockquote>`; continue; }
    if (/^\s*([-*+]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l); let items = [];
      while (i < lines.length && (/^\s*([-*+]|\d+\.)\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        if (/^\s*([-*+]|\d+\.)\s+/.test(lines[i])) items.push(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, '')); else items[items.length - 1] += ' ' + lines[i].trim();
        i++;
      }
      out += `<${ordered ? 'ol' : 'ul'}>${items.map(x => `<li>${inline(x)}</li>`).join('')}</${ordered ? 'ol' : 'ul'}>`; continue;
    }
    if (!l.trim()) { i++; continue; }
    let p = l; i++; while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|```|\s*[-*+]\s|\s*\d+\.\s|\s*\||\s*>)/.test(lines[i])) p += ' ' + lines[i++].trim();
    out += `<p>${inline(p)}</p>`;
  }
  return out;
}
// The diff, read as words: new lines lit, old lines struck through, a little context around them.
function diffHtml(d) {
  const say = l => { const t = l.replace(/^\s*([-*+]|\d+\.)\s+/, '').replace(/^#+\s*/, ''); return t.trim() ? inline(t) : ''; };
  let out = '', gap = false;
  for (const l of d.split('\n')) {
    if (/^(diff --git|index |--- |\+\+\+ |new file|deleted file|\\ No newline)/.test(l)) continue;
    if (l.startsWith('@@')) { if (out) gap = true; continue; }
    const t = say(l.slice(1)); if (!t) continue;
    if (gap) { out += '<span class="h">…</span>'; gap = false; }
    out += l[0] === '+' ? `<span class="a">${t}</span>` : l[0] === '-' ? `<span class="d">${t}</span>` : `<span class="c">${t}</span>`;
  }
  return `<div class="diff">${out || '<span class="c">Only spacing changed.</span>'}</div>`;
}
function wireLinks(el) { el.querySelectorAll('[data-ref]').forEach(a => a.onclick = () => openBlock(a.dataset.ref)); }

// ---------- the left side: theirs ----------
let NAV = null;
function itemHtml(it, disabled) {
  const exists = !it.block || byPath[it.block];
  if (!exists) return '';
  const inner = `<span class="ic">${icon(it.icon || (it.block ? 'book' : 'link'))}</span><span class="t"><div>${esc(it.name)}</div>${it.sub ? `<div class="sub">${esc(it.sub)}</div>` : ''}</span>`;
  if (it.block) return `<button class="item" data-ref="${esc(it.block)}">${inner}</button>`;
  const local = /^\//.test(it.url || '');
  return `<a class="item" href="${esc(it.url || '#')}"${local ? '' : ' target="_blank" rel="noopener"'}>${inner}</a>`;
}
function groupsHtml(groups) { return groups.map(g => `<div class="group">${esc(g.name)}</div>${(g.items || []).map(it => itemHtml(it)).join('')}${!(g.items || []).length && g.empty ? `<div class="empty">${esc(g.empty)}</div>` : ''}`).join(''); }
function renderNav() {
  const q = $('q').value.trim().toLowerCase();
  let h = '';
  if (q) {
    const all = nodes.filter(n => n.path && (n.title.toLowerCase().includes(q) || n.path.toLowerCase().includes(q) || (S.words[n.path] || '').toLowerCase().includes(q) || (n.about || '').toLowerCase().includes(q))).slice(0, 30);
    h = `<div class="group">In the brain</div>` + (all.map(n => `<button class="item" data-ref="${esc(n.path)}"><span class="ic">${icon(n.kind === 'room' ? 'room' : 'book')}</span><span class="t"><div>${esc(n.title)}</div><div class="sub">${esc(S.words[n.path] ? '“' + S.words[n.path] + '” · ' : '')}${esc(n.path)}</div></span></button>`).join('') || `<div class="empty">Nothing matches “${esc(q)}”.</div>`);
  } else if (NAV?.mine) {
    h = groupsHtml(NAV.mine.groups || []);
  } else if (NAV) {
    h = `<div class="yours"><b>This side is yours.</b>Put whatever you reach for here: your AI's pages, the sites you open every day, the blocks you check most. Ask your AI to add things, or start from this set and change it later.<br><button class="use" id="usesug">Use this set</button></div><div class="suggested">${groupsHtml(NAV.suggested.groups || [])}</div>`;
  }
  $('navlist').innerHTML = h;
  $('navlist').querySelectorAll('[data-ref]').forEach(b => b.onclick = () => { const n = byPath[b.dataset.ref]; n ? openNode(n) : openBlock(b.dataset.ref); });
  const u = $('usesug'); if (u) u.onclick = async () => { NAV = await post('/api/nav/use-suggested'); renderNav(); toast('Done. Your AI can change it any time.'); };
}
$('q').addEventListener('input', renderNav);

// ---------- the right side: what's waiting ----------
let doneFlags = [], saves = [];
function renderSide() {
  const ch = [...changed].map(p => byPath[p]).filter(Boolean);
  const open = S?.flags || [];
  let h = '';
  h += `<div class="sec"><h3><span>Changed since you looked</span>${ch.length ? '<button id="seenall">Seen all</button>' : ''}</h3>` +
    (ch.length ? ch.map(n => `<button class="row glow" data-ref="${esc(n.path)}"><b>${esc(n.title)}</b><small>${esc(n.parent?.title && n.parent.kind === 'room' ? n.parent.title + ' · ' : '')}${ago(n.mtime)}</small></button>`).join('')
      : `<div class="quiet">Nothing new. When your AI saves to its memory, the block glows here and on the web until you've looked.</div>`) + '</div>';
  h += `<div class="sec"><h3><span>Flags</span></h3>` +
    (open.length ? open.map(f => `<button class="row flag" data-ref="${esc(f.path)}"><b>${esc(byPath[f.path]?.title || f.path)}</b><small>${esc(f.note || f.quote || 'No words yet')}</small></button>`).join('') : '') +
    doneFlags.slice(0, 3).map(f => `<button class="row done" data-ref="${esc(f.path)}"><b>✓ ${esc(byPath[f.path]?.title || f.path)}</b><small class="what">${esc(f.what)}</small></button>`).join('') +
    (!open.length && !doneFlags.length ? `<div class="quiet">Open any block and tap ⚑ when something's wrong, old or tangled. Select a passage first to flag just that part. Your AI fixes it and answers here.</div>` : '') + '</div>';
  h += `<div class="sec"><h3><span>Recent saves</span></h3>`;
  let last = '';
  for (const s of saves.slice(0, 14)) {
    const day = dayOf(s.date); if (day !== last) { h += `<div class="day">${day}</div>`; last = day; }
    const names = s.paths.map(p => byPath[p]?.title || p.split('/').pop().replace(/\.md$/, ''));
    h += `<button class="row save" data-paths="${esc(s.paths.join('|'))}"><b>${esc(s.subject || names[0])}</b><small class="paths">${esc(names.join(', '))} · ${ago(s.date)}</small></button>`;
  }
  if (!saves.length) h += `<div class="quiet">No saves this week.</div>`;
  h += '</div>';
  $('sidebody').innerHTML = h;
  $('sidebody').querySelectorAll('[data-ref]').forEach(b => b.onclick = () => { const n = byPath[b.dataset.ref]; n ? openNode(n) : openBlock(b.dataset.ref); });
  $('sidebody').querySelectorAll('[data-paths]').forEach(b => {
    b.onclick = () => replay(b.dataset.paths.split('|'));
    b.onmouseenter = () => { lit = new Set(b.dataset.paths.split('|')); litUntil = performance.now() + 1e9; };
    b.onmouseleave = () => { litUntil = 0; };
  });
  const sa = $('seenall'); if (sa) sa.onclick = async () => { await post('/api/seen', {}); changed.clear(); renderSide(); renderSince(); toast('All caught up.'); };
}
function replay(paths) { paths.forEach((p, i) => { const n = byPath[p]; if (n) setTimeout(() => pulses.push({ n, t: 0 }), i * 160); }); }
function renderSince() {
  const n = changed.size, b = $('since');
  b.classList.toggle('on', n > 0);
  b.textContent = n === 1 ? '1 change since you looked' : `${n} changes since you looked`;
}
$('since').onclick = () => { lit = new Set(changed); litUntil = performance.now() + 4000; replay([...changed]); if (innerWidth <= 980) $('side').classList.add('open'); };

// ---------- welcome: whose picture is in the middle ----------
function renderWelcome() {
  const el = $('welcome');
  if (!S || NAV?.welcomeDismissed || (!S.ai.placeholder && !S.example)) { el.classList.remove('on'); return; }
  $('wimg').src = '/api/picture/ai';
  $('wtitle').textContent = S.ai.placeholder ? "That's Odie in the middle." : 'This is an example brain.';
  $('wtext').innerHTML = (S.ai.placeholder ? `<p>Odie is the AI this Homebase was built with. Your AI's name and picture go in the middle: ask it to put itself there.</p>` : '') +
    (S.example ? `<p>You're looking at an example brain. Your AI points Homebase at its own memory during setup, and then this web is yours.</p>` : `<p>The web around it is your AI's memory. Tap any light to read it.</p>`);
  el.classList.add('on');
}
$('wgot').onclick = async () => { await post('/api/nav/dismiss-welcome'); NAV && (NAV.welcomeDismissed = true); $('welcome').classList.remove('on'); };

// ---------- phones ----------
document.querySelectorAll('#mob [data-t]').forEach(b => b.onclick = () => { const t = b.dataset.t, other = t === 'nav' ? 'side' : 'nav'; $(other).classList.remove('open'); $(t).classList.toggle('open'); });

// ---------- greeting ----------
function tick() {
  const d = new Date(), h = d.getHours();
  const who = S?.person ? ', ' + S.person : '';
  $('greet').textContent = (h < 5 ? 'Late night' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening') + who;
  $('clock').textContent = d.toLocaleString([], { weekday: 'long', hour: 'numeric', minute: '2-digit' });
}
setInterval(tick, 20000);

// ---------- keeping it live ----------
let first = true;
async function refresh() {
  let d; try { d = await j('/api/web'); } catch { return; }
  const sig = JSON.stringify([d.center?.path, d.boot.map(b => b.path), d.rooms.map(r => [r.id, r.title, r.blocks.map(b => [b.path, b.support.length])]), d.threads.length, d.edges, d.ai]);
  const rebuild = sig !== refresh.sig; refresh.sig = sig;
  S = d;
  AI = d.ai.color || '#f2a84b'; AI2 = mix(AI);
  document.documentElement.style.setProperty('--ai', AI); document.documentElement.style.setProperty('--ai2', AI2);
  if (rebuild) {
    const w = makeWorld(d); nodes = w.N; links = w.L; byPath = w.P; center = w.c; edges = w.E;
    if (focus) focus = nodes.find(n => n.id === focus.id) || null;
    if (first || !focus) goHome();
    for (const e of edges) if (e.pic && !pics[e.pic]) loadImg(e.pic).then(i => { pics[e.pic] = i; });
  } else {
    // keep node objects; just freshen the times
    const t = {}; for (const b of [d.center, ...d.boot, ...d.rooms.flatMap(r => [...r.blocks, ...r.blocks.flatMap(b => b.support)])]) if (b) t[b.path] = b.mtime;
    for (const n of nodes) if (n.path && t[n.path]) n.mtime = t[n.path];
  }
  // a save we saw land: send a pulse to it
  const m = {}; for (const n of nodes) if (n.path && n.mtime) m[n.path] = n.mtime;
  if (!first) for (const p in m) if (lastM[p] !== m[p]) { const n = byPath[p]; if (n) pulses.push({ n, t: 0 }); if (readerData?.path === p) openBlock(p, readerTab); }
  lastM = m;
  changed = new Set(d.changed.map(c => c.path));
  flagged = new Set(d.flags.map(f => f.path));
  if (first) { tick(); }
  first = false;
}
function mix(hex) { const [r, g, b] = rgb(hex); const m = v => Math.round(v + (255 - v) * .42); return '#' + [m(r), m(g), m(b)].map(v => v.toString(16).padStart(2, '0')).join(''); }
async function refreshAll() {
  await refresh();
  try { const f = await j('/api/flags'); doneFlags = f.done || []; } catch {}
  try { const r = await j('/api/recent'); saves = r.saves || []; } catch {}
  renderSide(); renderSince();
}

(async () => {
  pics.ai = await loadImg('/api/picture/ai');
  try { NAV = await j('/api/nav'); } catch { NAV = { mine: null, suggested: { groups: [] } }; }
  await refreshAll();
  renderNav(); renderWelcome();
  requestAnimationFrame(frame);
  // ?open=money/budget.md opens a block on arrival, so an AI can point its person straight at one
  const want = new URLSearchParams(location.search).get('open');
  if (want) {
    $('reader').style.transition = 'none';
    const n = byPath[want]; n ? openNode(n) : openBlock(want);
    Object.assign(cam, camT);
    setTimeout(() => { $('reader').style.transition = ''; }, 600);
  }
  else if (saves[0]) setTimeout(() => replay(saves[0].paths), 900);
  setInterval(async () => {
    const before = refresh.sig;
    await refreshAll();
    if (refresh.sig !== before && !$('q').value) renderNav();
  }, 4000);
  // a new picture or name for the AI shows up on its own
  setInterval(async () => { const i = await loadImg('/api/picture/ai?' + Date.now()); if (i) pics.ai = i; }, 30000);
})();
})();
</script>
